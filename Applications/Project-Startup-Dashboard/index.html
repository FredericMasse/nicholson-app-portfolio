<!DOCTYPE html>
<html>

<head>
    <title>Nicholson Project Startup Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Nicholson Project Startup Dashboard</h1>

    <div id="summary">
        0 of 6 tasks completed
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Contract Executed
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Budget Approved
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Insurance Confirmed
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Safety Plan Complete
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Site Access Established
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Schedule Created
    </div>

   <script src="script.js"> </script>

</body>

</html>
