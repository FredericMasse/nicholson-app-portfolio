<!DOCTYPE html>
<html>

<head>
    <title>Nicholson Project Startup Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Nicholson Project Startup Dashboard</h1>

    <div class="project-info">

    <h2>Project Information</h2>

    <div class="field">
        <label>Project Name</label>
        <input type="text" placeholder="Enter project name">
    </div>

    <div class="field">
        <label>Project Manager</label>
        <input type="text" placeholder="Enter PM name">
    </div>

    <div class="field">
        <label>Client</label>
        <input type="text" placeholder="Enter client">
    </div>

    <div class="field">
        <label>Contract Value</label>
        <input type="text" placeholder="$0">
    </div>

</div>

    <div id="summary">
        0 of 6 tasks completed
    </div>
    
<div id="progress-container">
    <div id="progress-bar"> </div>
</div>
    
    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Contract Executed
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Budget Approved
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Insurance Confirmed
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Safety Plan Complete
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Site Access Established
    </div>

    <div class="task-row">
        <input type="checkbox" class="task" onchange="updateSummary()">
        Schedule Created
    </div>

   <script src="script.js"> </script>

</body>

</html>
